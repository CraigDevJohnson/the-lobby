<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundry — Check then join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&family=Rubik:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--seafoam:#74cebf;--navy:#233552;--mint:#dcf4ee;--custard:#ffd983;--coral:#ff845c}
*{box-sizing:border-box}
html{background:var(--seafoam);color:var(--navy);font-family:"Nunito Sans",sans-serif}
body{margin:0;height:100dvh;overflow:hidden;display:grid;grid-template-rows:104px 1fr 84px}
::selection{background:var(--custard);color:var(--navy)}
button{color:inherit;font:inherit;cursor:default}
button:focus-visible{outline:3px solid var(--navy);outline-offset:6px}
.shell{width:min(100% - 112px,1128px);margin-inline:auto}
header .shell{height:100%;display:flex;align-items:center;justify-content:space-between;border-bottom:1.5px solid var(--navy)}
.brand{font-family:Rubik,sans-serif;font-size:26px;font-weight:700;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:30px}
.text-control{padding:8px 0;border:0;background:transparent;font-weight:700;text-decoration:underline;text-underline-offset:5px;font-size:16px}
.quiet{min-height:44px;padding:10px 20px;border:2px solid var(--navy);border-radius:12px;background:transparent;font-family:Rubik,sans-serif;font-weight:500;font-size:16px}
main{padding-block:52px 42px;align-self:center}
h1,h2,p{margin:0}
h1,h2{font-family:Rubik,sans-serif;text-wrap:balance;letter-spacing:-.025em}
h1{font-size:58px;line-height:1.05;font-weight:700}
.intro{font-size:21px;line-height:1.4;font-weight:600;margin-top:15px;max-width:60ch}
.steps{margin-top:38px;display:grid;grid-template-columns:42% 58%;border:2px solid var(--navy);border-radius:20px;background:var(--mint);overflow:hidden}
.step{padding:34px 38px 38px;min-width:0;min-height:346px}
.step+.step{border-left:1.5px solid var(--navy);padding-left:44px}
.step-title{display:flex;align-items:center;gap:12px;font-family:Rubik,sans-serif;font-size:18px;font-weight:500;letter-spacing:-.015em}
.number{display:grid;place-items:center;border:1.5px solid var(--navy);border-radius:50%;width:31px;height:31px;font-size:15px;flex:none}
.status{font-family:Rubik,sans-serif;font-size:31px;line-height:1.15;letter-spacing:-.02em;font-weight:600;margin-top:34px;max-width:12ch}
.status-detail{margin-top:13px;display:flex;align-items:center;gap:9px;font-size:16px;font-weight:600;line-height:1.5}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--navy);flex:none}
.recheck{margin-top:22px}
.join-copy{font-size:20px;font-weight:600;line-height:1.4;margin-top:32px}
.primary{display:block;width:100%;margin-top:21px;min-height:76px;padding:15px 24px;background:var(--custard);border:3px solid var(--navy);border-radius:17px;box-shadow:0 8px 0 -1px var(--coral),0 14px 14px -6px rgb(35 53 82 / .22);font-family:Rubik,sans-serif;font-weight:600;font-size:29px;line-height:1.2;letter-spacing:-.015em}
.caveat{font-size:16px;font-weight:600;line-height:1.5;margin-top:27px}
footer .shell{height:100%;border-top:1.5px solid var(--navy);display:flex;align-items:center;justify-content:space-between;gap:20px}
.preview-note{font-size:14px;font-weight:600;line-height:1.4}
@media(max-width:720px){
body{height:auto;min-height:100dvh;overflow:auto;grid-template-rows:auto 1fr auto}
.shell{width:calc(100% - 40px)}
header .shell{min-height:110px;padding-block:19px;flex-wrap:wrap;gap:12px}
.brand{font-size:24px}
nav{gap:20px}
.text-control{font-size:15px}
.quiet{padding-inline:13px;font-size:14px}
main{padding-block:36px 42px}
h1{font-size:42px}
.intro{font-size:19px;line-height:1.4;margin-top:13px}
.steps{margin-top:28px;grid-template-columns:1fr;border-radius:16px}
.step{min-height:0;padding:25px}
.step+.step{border-left:0;border-top:1.5px solid var(--navy);padding:25px 25px 31px}
.step-title{font-size:17px;gap:10px}
.status{max-width:15ch;font-size:27px;margin-top:26px}
.status-detail{margin-top:12px;font-size:15px}
.recheck{margin-top:13px}
.join-copy{font-size:18px;margin-top:24px}
.primary{font-size:25px;min-height:70px;margin-top:20px;padding-inline:15px}
.caveat{font-size:15px;margin-top:25px;max-width:24ch}
footer .shell{padding-block:21px;align-items:flex-start;flex-direction:column;gap:12px}
.preview-note{font-size:12px}
}
@media(min-width:721px) and (max-height:780px){body{grid-template-rows:84px 1fr 66px}main{padding-block:24px}h1{font-size:46px}.steps{margin-top:26px}.step{min-height:310px;padding-top:25px;padding-bottom:26px}}
</style>
</head>
<body>
<header>
  <div class="shell">
    <span class="brand">The Lobby</span>
    <nav aria-label="Main navigation">
      <button type="button" class="text-control" aria-disabled="true">Back to Tools</button>
      <button type="button" class="quiet" aria-disabled="true">Sign out</button>
    </nav>
  </div>
</header>
<main class="shell">
  <h1>Foundry</h1>
  <p class="intro">Check availability, then open Foundry to join your game.</p>
  <div class="steps">
    <section class="step" aria-labelledby="check-heading">
      <h2 class="step-title" id="check-heading"><span class="number">1</span>Check availability</h2>
      <p class="status">Foundry is responding</p>
      <p class="status-detail"><span class="status-dot" aria-hidden="true"></span>Last checked just now</p>
      <button type="button" class="text-control recheck" aria-disabled="true">Check again</button>
    </section>
    <section class="step" aria-labelledby="join-heading">
      <h2 class="step-title" id="join-heading"><span class="number">2</span>Join in Foundry</h2>
      <p class="join-copy">Finish joining inside Foundry.</p>
      <button type="button" class="primary" aria-disabled="true">Open Foundry</button>
      <p class="caveat">The game may still be getting set up.</p>
    </section>
  </div>
</main>
<footer>
  <div class="shell">
    <button type="button" class="text-control" aria-disabled="true">Privacy</button>
    <p class="preview-note">Design preview · example status · controls are inactive</p>
  </div>
</footer>
</body>
</html>
