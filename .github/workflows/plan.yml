# Shows what deploying one explicitly approved pull-request commit would
# change in AWS and Cloudflare, without changing anything. The issue_comment
# event always loads this workflow from the default branch; Craig names the
# exact commit in a `/plan <full SHA>` comment before any untrusted code is
# checked out. The credentialed job uses the main-only dev environment, which
# keeps its secrets and OIDC roles out of every pull-request workflow.
name: Plan

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  authorize:
    name: Authorize
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/plan ') &&
      github.event.comment.user.login == github.repository_owner &&
      github.actor == github.repository_owner &&
      github.triggering_actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      head_sha: ${{ steps.target.outputs.head_sha }}
      approved: ${{ steps.target.outputs.approved }}
    steps:
      # This job has no checkout, secrets or OIDC permission. It accepts only
      # a full commit id, then proves that id is still the open pull request's
      # same-repository head before the credentialed job can start.
      - name: Resolve the approved commit
        id: target
        env:
          COMMAND: ${{ github.event.comment.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [[ ! "$COMMAND" =~ ^/plan[[:space:]]+([0-9a-f]{40})[[:space:]]*$ ]]; then
            echo "::error::Use /plan followed by the pull request's full 40-character commit id."
            exit 1
          fi
          head_sha="${BASH_REMATCH[1]}"
          pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          if ! jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$head_sha" \
            '.state == "open" and .head.repo.full_name == $repo and .head.sha == $sha' \
            <<<"$pull_request" >/dev/null; then
            echo "::error::The named commit is not the open pull request's same-repository head."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "approved=true" >> "$GITHUB_OUTPUT"

  plan:
    name: Plan
    needs: authorize
    if: needs.authorize.outputs.approved == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: dev
    permissions:
      id-token: write # assume the read-only planner role through OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: Build the Lambda zip, so the plan reflects this code
        run: task lambda

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PR_PLANNER_ROLE_ARN }}
          aws-region: us-west-2

      # The script keeps the full plan out of the log (this repository is
      # public) and writes only resource names and totals to the job summary.
      # Plans only ever target dev, with a read-only Cloudflare token. Every
      # sensitive value below is a dev environment secret, never a repository
      # secret, so pull-request jobs cannot name and read one themselves.
      - name: Plan dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_READ_ONLY }}
          TF_VAR_origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
          # The family devices page (ADR 0010): an empty list until Craig
          # sets the secret, so the plan and deploy go through before it.
          # The list and the two endpoints are secrets, not variables: the
          # log prints a step's env, and only a secret's value is masked.
          TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS_DEV || '[]' }}
          TF_VAR_kids_doh_url: ${{ secrets.KIDS_DOH_URL }}
          TF_VAR_adults_doh_url: ${{ secrets.ADULTS_DOH_URL }}
          TF_VAR_gateway_root_ca_pem: ${{ vars.GATEWAY_ROOT_CA_PEM }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::The dev environment's CLOUDFLARE_API_TOKEN_READ_ONLY secret is not set; skipping the plan."
            exit 0
          fi
          bash .github/scripts/tofu.sh plan dev
