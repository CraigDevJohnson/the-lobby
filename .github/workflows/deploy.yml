# Builds the site once, deploys that build to dev, then to production after
# Craig approves (baseline, "How it is run"). Runs on every push to main and
# by hand (Run workflow), which is also how an older commit is deployed again:
# run it from a tag or branch at that commit. See docs/pipeline.md.
#
# The AWS roles trust the deploy jobs through GitHub OIDC with the subjects
# repo:CraigDevJohnson/the-lobby:environment:dev and ...:environment:production,
# so each deploy job must declare its environment.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      prod_exists: ${{ steps.prod.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: go test
        run: task test

      - name: Build the Lambda zip
        run: task lambda

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ github.sha }}
          path: dist/site.zip
          if-no-files-found: error
          retention-days: 30

      # hashFiles() is not available in a job-level "if", so the build job
      # answers the question and the production job reads the answer.
      - name: Is there a production root yet?
        id: prod
        run: |
          if [ -f infra/environments/prod/main.tf ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  dev:
    name: Deploy dev
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: dev
      url: https://dev.craigdevjohnson.com
    concurrency: deploy-dev # a second run waits; it is never cancelled mid-apply
    permissions:
      id-token: write # assume the dev deployer role through OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the zip the build job made
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: dist

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS_DEV }}
          TF_VAR_origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
        run: bash .github/scripts/tofu.sh apply dev

      - name: Smoke test
        run: |
          api=$(tofu -chdir=infra/environments/dev output -raw api_endpoint)
          bash .github/scripts/smoke.sh dev.craigdevjohnson.com "$api"

  production:
    name: Deploy production
    needs: [build, dev]
    if: needs.build.outputs.prod_exists == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production # requires Craig's approval in GitHub
      url: https://craigdevjohnson.com
    concurrency: deploy-production
    permissions:
      id-token: write # assume the production deployer role through OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the same zip dev got
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site-${{ github.sha }}
          path: dist

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOYER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS_PROD }}
          TF_VAR_origin_secret: ${{ secrets.ORIGIN_SECRET_PROD }}
        run: bash .github/scripts/tofu.sh apply prod

      # The production root reports its own hostname (next.craigdevjohnson.com
      # until the switch, then craigdevjohnson.com), so the test follows it.
      - name: Smoke test
        run: |
          host=$(tofu -chdir=infra/environments/prod output -raw hostname)
          api=$(tofu -chdir=infra/environments/prod output -raw api_endpoint)
          bash .github/scripts/smoke.sh "$host" "$api"
