# Builds the site once, then deploys that build to dev and production after
# Craig approves (baseline, "How it is run"). Runs on every push to main,
# except one that changes only CHANGELOG.md, and by hand (Run workflow) on
# main. The production environment takes only main, so a rollback is a revert
# on main, not a run from an older tag or branch. See docs/pipeline.md.
#
# Both AWS deployer roles trust the deploy job through GitHub OIDC with the
# subject repo:CraigDevJohnson@42454849/the-lobby@1408231725:environment:production.
# The mutable Cloudflare token exists only in that protected environment, so
# no repository code receives production authority before approval.
name: Deploy

on:
  push:
    branches: [main]
    # A changelog-only merge changes nothing that is deployed, so it starts
    # no run and asks for no production approval.
    paths-ignore:
      - CHANGELOG.md
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      prod_exists: ${{ steps.prod.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x

      - name: go test
        run: task test

      - name: Build the Lambda zip
        run: task lambda

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ github.sha }}
          path: dist/site.zip
          if-no-files-found: error
          retention-days: 30

      # Report whether this checkout has the production root, so the deploy
      # job can leave its production-only steps out on a fresh setup.
      - name: Is there a production root yet?
        id: prod
        run: |
          if [ -f infra/environments/prod/main.tf ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    name: Deploy dev, then production
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production # requires Craig's approval before any deploy code runs
      url: https://craigdevjohnson.com
    concurrency: deploy-production # one approved deployment at a time
    permissions:
      id-token: write # assume each environment's deployer role through OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch the zip the build job made
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-${{ github.sha }}
          path: dist

      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - name: Configure AWS credentials for dev
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEV_DEPLOYER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Apply dev
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_origin_secret: ${{ secrets.ORIGIN_SECRET_DEV }}
          # The family devices page (ADR 0010): an empty list until Craig
          # sets the secret, so the deploy goes through before it. The list
          # and the two endpoints are secrets, not variables: the log prints
          # a step's env, and only a secret's value is masked.
          TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS_DEV || '[]' }}
          TF_VAR_kids_doh_url: ${{ secrets.KIDS_DOH_URL }}
          TF_VAR_adults_doh_url: ${{ secrets.ADULTS_DOH_URL }}
          TF_VAR_gateway_root_ca_pem: ${{ vars.GATEWAY_ROOT_CA_PEM }}
        run: bash .github/scripts/tofu.sh apply dev

      # The third argument says whether /admin has its Access application
      # yet, so the test knows what the page should answer.
      - name: Smoke test dev
        run: |
          api=$(tofu -chdir=infra/environments/dev output -raw api_endpoint)
          admin=$(tofu -chdir=infra/environments/dev output -raw access_admin_aud)
          bash .github/scripts/smoke.sh dev.craigdevjohnson.com "$api" "$admin"

      # The same approved job changes roles here. The AWS policies remain
      # environment-specific; only the GitHub approval boundary is shared.
      - name: Configure AWS credentials for production
        if: needs.build.outputs.prod_exists == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PROD_DEPLOYER_ROLE_ARN }}
          aws-region: us-west-2

      - name: Apply production
        if: needs.build.outputs.prod_exists == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_origin_secret: ${{ secrets.ORIGIN_SECRET_PROD }}
          TF_VAR_admin_emails: ${{ secrets.ADMIN_EMAILS_PROD || '[]' }}
          TF_VAR_kids_doh_url: ${{ secrets.KIDS_DOH_URL }}
          TF_VAR_adults_doh_url: ${{ secrets.ADULTS_DOH_URL }}
          TF_VAR_gateway_root_ca_pem: ${{ vars.GATEWAY_ROOT_CA_PEM }}
        run: bash .github/scripts/tofu.sh apply prod

      # The production root reports its own hostname (next.craigdevjohnson.com
      # until the switch, then craigdevjohnson.com), so the test follows it.
      - name: Smoke test production
        if: needs.build.outputs.prod_exists == 'true'
        run: |
          host=$(tofu -chdir=infra/environments/prod output -raw hostname)
          api=$(tofu -chdir=infra/environments/prod output -raw api_endpoint)
          admin=$(tofu -chdir=infra/environments/prod output -raw access_admin_aud)
          bash .github/scripts/smoke.sh "$host" "$api" "$admin"
