version: '3'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  test:
    desc: Run the Go tests
    cmds:
      - go test ./...

  fmt:
    desc: Format Go code
    cmds:
      - gofmt -l -w cmd internal

  fmt:check:
    desc: Fail if any Go file is not gofmt-formatted
    silent: true
    cmds:
      - |
        unformatted=$(gofmt -l cmd internal)
        if [ -n "$unformatted" ]; then
          echo "Not gofmt-formatted (run: task fmt):"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Vet Go code
    cmds:
      - go vet ./...

  ci:
    desc: Everything the pull-request checks run; needs no credentials
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: ui:check
      - task: ui:test
      - task: infra:check

  run:
    desc: Serve on a developer's computer (memory store, sign-in disabled)
    deps: [ui:build]
    cmds:
      - go run ./cmd/site

  ui:install:
    desc: Install the screens' npm packages from the lockfile
    dir: web
    sources: [package.json, package-lock.json]
    generates: [node_modules/.package-lock.json]
    cmds:
      - npm ci --no-audit --no-fund

  ui:build:
    desc: Build the screens into internal/web/dist (ADR 0003)
    deps: [ui:install]
    dir: web
    cmds:
      - npm run build

  ui:check:
    desc: Typecheck the screens
    deps: [ui:install]
    dir: web
    cmds:
      - npm run check

  ui:test:
    desc: Test the screens' own logic with Node's test runner (Node 22.18 or later)
    deps: [ui:install]
    dir: web
    cmds:
      - npm test

  lambda:
    desc: Build the Lambda zip, one static arm64 binary named bootstrap (ADR 0002)
    deps: [ui:build]
    cmds:
      - mkdir -p dist/site
      - CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/site/bootstrap ./cmd/site
      - cd dist/site && rm -f ../site.zip && zip -q -X ../site.zip bootstrap
      - ls -l dist/site.zip

  infra:check:
    desc: Format, validate and test every OpenTofu root offline
    cmds:
      - tofu fmt -check -recursive infra
      - for: [infra/bootstrap, infra/modules/site, infra/environments/dev, infra/environments/prod]
        cmd: tofu -chdir={{.ITEM}} init -backend=false -input=false >/dev/null && tofu -chdir={{.ITEM}} validate
      - tofu -chdir=infra/modules/site test
      - tofu -chdir=infra/bootstrap test

  infra:dev:plan:
    desc: Plan dev from a developer's computer (AWS_PROFILE and a Cloudflare token)
    cmds:
      - task: infra:dev:tofu
        vars: { COMMAND: plan }

  infra:dev:apply:
    desc: Apply dev from a developer's computer (AWS_PROFILE and a Cloudflare token)
    cmds:
      - task: infra:dev:tofu
        vars: { COMMAND: apply }

  # Shared by infra:dev:plan and infra:dev:apply. The Cloudflare token comes
  # from CLOUDFLARE_API_TOKEN if set, else from the file CLOUDFLARE_API_TOKEN_FILE
  # names (default ~/.config/craigdevjohnson/cloudflare_api_token). The AWS
  # session comes from AWS_PROFILE (aws sso login). The secrets OpenTofu needs
  # (allowed_emails, origin_secret) come from the gitignored
  # infra/environments/dev/secrets.auto.tfvars; see secrets.auto.tfvars.example.
  infra:dev:tofu:
    internal: true
    silent: true
    requires:
      vars: [COMMAND]
    preconditions:
      - sh: test -n "$AWS_PROFILE"
        msg: "Set AWS_PROFILE to the workloads account's profile, then: aws sso login"
    cmds:
      - |
        if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
          token_file="${CLOUDFLARE_API_TOKEN_FILE:-$HOME/.config/craigdevjohnson/cloudflare_api_token}"
          if [ ! -r "$token_file" ]; then
            echo "No Cloudflare token: set CLOUDFLARE_API_TOKEN, or put the token in $token_file (or set CLOUDFLARE_API_TOKEN_FILE)." >&2
            exit 1
          fi
          CLOUDFLARE_API_TOKEN=$(cat "$token_file")
          export CLOUDFLARE_API_TOKEN
        fi
        echo "tofu -chdir=infra/environments/dev {{.COMMAND}} -input=false -var-file=dev.tfvars"
        tofu -chdir=infra/environments/dev {{.COMMAND}} -input=false -var-file=dev.tfvars

  member:list:
    desc: List the Members and their Tools in ENV (dev, prod, or both when unset)
    cmds:
      - task: member
        vars: { ENV: '{{.ENV | default "dev prod"}}', ARGS: list }

  member:add:
    desc: Invite MEMBER to ENV with TOOLS, or replace the Tools they have there
    requires:
      vars: [ENV, MEMBER, TOOLS]
    preconditions:
      - sh: 'case {{.MEMBER | trim | shellQuote}} in *@*) ;; *) exit 1 ;; esac'
        msg: "MEMBER is the Member's address, for example MEMBER=someone@example.com"
      - sh: '[ -n {{.TOOLS | replace "," " " | trim | shellQuote}} ]'
        msg: 'TOOLS names at least one Tool, for example TOOLS="soccer minecraft"'
    cmds:
      - task: member
        vars:
          ENV: '{{.ENV}}'
          ARGS: 'add {{shellQuote .MEMBER}}{{range splitArgs (.TOOLS | replace "," " ")}} {{shellQuote .}}{{end}}'

  member:remove:
    desc: Remove MEMBER from ENV, which ends their Sign-in sessions there at once
    requires:
      vars: [ENV, MEMBER]
    preconditions:
      - sh: 'case {{.MEMBER | trim | shellQuote}} in *@*) ;; *) exit 1 ;; esac'
        msg: "MEMBER is the Member's address, for example MEMBER=someone@example.com"
    cmds:
      - task: member
        vars: { ENV: '{{.ENV}}', ARGS: 'remove {{shellQuote .MEMBER}}' }

  # Shared by the member tasks: the site's Owner command (ADR 0004; "Inviting
  # Members" in infra/README.md), run against each environment's own table,
  # site-<env>-sessions in us-west-2. ENV is dev, prod, or both ("dev prod"),
  # all checked before anything runs. The AWS session comes from AWS_PROFILE,
  # workloads-admin unless set (aws sso login). TOOLS is the Member's whole
  # list, spaced or comma-separated, because add replaces what they had.
  member:
    internal: true
    silent: true
    requires:
      vars: [ENV, ARGS]
    preconditions:
      - sh: |
          envs={{.ENV | replace "," " " | trim | shellQuote}}
          [ -n "$envs" ] || exit 1
          for env in $envs; do
            case "$env" in dev|prod) ;; *) exit 1 ;; esac
          done
        msg: 'ENV is dev, prod, or both ("dev prod"), not "{{.ENV}}"'
    cmds:
      - |
        for env in {{.ENV | replace "," " "}}; do
          echo "$env (site-$env-sessions):"
          AWS_PROFILE={{.AWS_PROFILE | default "workloads-admin" | shellQuote}} AWS_REGION=us-west-2 SESSIONS_TABLE="site-$env-sessions" \
            go run ./cmd/site member {{.ARGS}} || exit 1
        done
